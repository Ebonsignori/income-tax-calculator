name: Cache Next.js build cache

runs:
  using: 'composite'
  steps:
    - name: Cache .next/cache
      uses: actions/cache
      with:
        path: ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-v14-${{ hashFiles('**/package-lock.json') }}-
