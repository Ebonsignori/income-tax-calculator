[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Disable automatic form detection since this is a static calculator
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Redirect www to non-www (if applicable)
 [[redirects]]
   from = "https://www.income-tax.org/*"
   to = "https://income-tax.org/:splat"
   status = 301
   force = true

# Ensure trailing slashes (Next.js config handles this, but good to be explicit)
[[redirects]]
  from = "/*"
  to = "/:splat/"
  status = 301
  force = false
  conditions = {Role = [""], Country = [""]}
  
# This ensures that 404s serve the custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
